# =========================================================================
# PROFILE DE DESENVOLVIMENTO (DEV)
# =========================================================================
# Este arquivo contém configurações específicas para o ambiente de desenvolvimento.
# Para ativar este profile, execute a aplicação com: -Dspring.profiles.active=dev
# ou configure a variável de ambiente: SPRING_PROFILES_ACTIVE=dev
app.error.include-stacktrace=true
# =========================================================================
# LOGGING MAIS VERBOSO PARA DESENVOLVIMENTO
# =========================================================================
# Nível de log DEBUG para o pacote do chatbot (mostra mais detalhes)
logging.level.com.chatbot.chatbotglpi=DEBUG

# Log do Spring Framework em nível DEBUG (útil para debug de beans, configs, etc.)
logging.level.org.springframework=INFO

# Log do Redis em nível DEBUG (mostra comandos executados)
logging.level.org.springframework.data.redis=DEBUG

# =========================================================================
# REDIS LOCAL PARA DESENVOLVIMENTO
# =========================================================================
# Geralmente em desenvolvimento usamos Redis local sem senha
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# =========================================================================
# CONFIGURAÇÕES DE DESENVOLVIMENTO DO CHATBOT
# =========================================================================
# TTL menor para testes (10 minutos ao invés de 30)
chatbot.conversation.ttl-minutes=10

# Validações mais permissivas para facilitar testes
chatbot.validation.title.min-length=5
chatbot.validation.title.max-length=200

chatbot.validation.description.min-length=10
chatbot.validation.description.max-length=2000

# =========================================================================
# ACTUATOR MAIS EXPOSTO EM DEV
# =========================================================================
# Expõe todos os endpoints do Actuator para facilitar debug
management.endpoints.web.exposure.include=*

# Mostra detalhes de health sempre (sem necessidade de autorização)
management.endpoint.health.show-details=always

# =========================================================================
# CONFIGURAÇÕES DO SERVIDOR
# =========================================================================
# Porta customizada para dev (evita conflito com outras aplicações)
server.port=8080

# =========================================================================
# MENSAGENS DE ERRO MAIS DETALHADAS
# =========================================================================
# Inclui stack trace nas respostas de erro (apenas para desenvolvimento!)
server.error.include-stacktrace=always
server.error.include-message=always
