# =========================================================================
# PROFILE DE PRODUÇÃO (PROD)
# =========================================================================
# Este arquivo contém configurações específicas para o ambiente de produção.
# Para ativar este profile, execute com: -Dspring.profiles.active=prod
# ou configure a variável de ambiente: SPRING_PROFILES_ACTIVE=prod

# =========================================================================
# LOGGING OTIMIZADO PARA PRODUÇÃO
# =========================================================================
# Nível de log INFO em produção (menos verboso, melhor performance)
logging.level.com.chatbot.chatbotglpi=INFO

# Log do Spring Framework apenas para WARN e ERROR
logging.level.org.springframework=WARN

# Desabilita logs de debug do Redis
logging.level.org.springframework.data.redis=WARN

# Arquivo de log em produção (recomendado usar sistema de agregação de logs)
logging.file.name=/var/log/chatbot/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# =========================================================================
# REDIS EM PRODUÇÃO
# =========================================================================
# Em produção, estas variáveis DEVEM ser configuradas via variáveis de ambiente
# Nunca deixe credenciais hardcoded no código!
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# Timeout maior para ambientes de rede mais lentos
spring.data.redis.timeout=5000ms

# Pool de conexões maior para suportar mais carga
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5

# =========================================================================
# CONFIGURAÇÕES DE PRODUÇÃO DO CHATBOT
# =========================================================================
# TTL padrão de 30 minutos
chatbot.conversation.ttl-minutes=30

# Validações rigorosas em produção
chatbot.validation.title.min-length=10
chatbot.validation.title.max-length=100

chatbot.validation.description.min-length=20
chatbot.validation.description.max-length=1000

# =========================================================================
# ACTUATOR RESTRITO EM PRODUÇÃO
# =========================================================================
# Expõe apenas health e metrics (segurança)
management.endpoints.web.exposure.include=health,metrics,prometheus

# Detalhes de health apenas para requisições autorizadas
management.endpoint.health.show-details=when-authorized

# Caminho customizado para dificultar acesso não autorizado
management.endpoints.web.base-path=/internal/actuator

# =========================================================================
# CONFIGURAÇÕES DE SEGURANÇA DO SERVIDOR
# =========================================================================
# Porta configurável via variável de ambiente
server.port=${SERVER_PORT:8080}

# Configurações de compressão para melhorar performance
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# =========================================================================
# TRATAMENTO DE ERROS EM PRODUÇÃO
# =========================================================================
# NUNCA expor stack traces em produção (segurança)
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never

# =========================================================================
# CONFIGURAÇÕES DE CACHE HTTP
# =========================================================================
# Cache de recursos estáticos (se houver)
spring.web.resources.cache.cachecontrol.max-age=3600

# =========================================================================
# CONFIGURAÇÕES DE TIMEOUT
# =========================================================================
# Timeout de conexão HTTP
server.connection-timeout=20s

# Timeout de leitura/escrita
spring.mvc.async.request-timeout=30000
