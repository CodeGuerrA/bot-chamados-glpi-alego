# =========================================================================
# CONFIGURACOES PRINCIPAIS DO CHATBOT GLPI
# =========================================================================
# Nome da aplicacao Spring Boot
spring.application.name=chatbot

# =========================================================================
# CONFIGURACOES DO REDIS
# =========================================================================
# Host do servidor Redis (pode ser sobrescrito por variavel de ambiente)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}

# Porta do servidor Redis (padrao: 6379)
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}

# Senha do Redis (vazio por padrao, configure via variavel de ambiente em producao)
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}

# Timeout de conexao com Redis em milissegundos
spring.data.redis.timeout=2000ms

# Pool de conexoes Lettuce (cliente Redis)
# Numero maximo de conexoes ativas no pool
spring.data.redis.lettuce.pool.max-active=8

# Numero maximo de conexoes ociosas no pool
spring.data.redis.lettuce.pool.max-idle=8

# Numero minimo de conexoes ociosas mantidas no pool
spring.data.redis.lettuce.pool.min-idle=0

# Tempo maximo de espera por uma conexao (-1ms = ilimitado)
spring.data.redis.lettuce.pool.max-wait=-1ms

# =========================================================================
# CONFIGURACOES PERSONALIZADAS DO CHATBOT
# =========================================================================
# Tempo em minutos que uma conversa permanece no Redis antes de expirar
chatbot.conversation.ttl-minutes=30

# Validacoes do campo "titulo" do chamado
chatbot.validation.title.min-length=10
chatbot.validation.title.max-length=100

# Validacoes do campo "descricao" do chamado
chatbot.validation.description.min-length=20
chatbot.validation.description.max-length=1000

# Prefixo usado nas chaves do Redis para identificar conversas
chatbot.redis.key-prefix=conversation:

# =========================================================================
# CONFIGURACOES DE LOGGING
# =========================================================================
# Nivel de log padrao (INFO e apropriado para producao)
logging.level.root=INFO

# Nivel de log especifico para o pacote do chatbot (DEBUG para desenvolvimento)
logging.level.com.chatbot.chatbotglpi=INFO

# Padrao de formato dos logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Padrao de log para arquivo (se configurado)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =========================================================================
# CONFIGURACOES DO ACTUATOR (Health Checks e Metricas)
# =========================================================================
# Configuracao do endpoint de health
management.endpoint.health.show-details=when-authorized

# Habilita health check do Redis
management.health.redis.enabled=true

# =========================================================================
# CONFIGURACOES DO SERVIDOR WEB
# =========================================================================
server.port=${SERVER_PORT:8082}

# Encoding de caracteres
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# =========================================================================
# CONFIGURACOES DE INTERNACIONALIZACAO (i18n)
# =========================================================================
# Encoding UTF-8 para arquivos de mensagens
spring.messages.encoding=UTF-8
spring.messages.basename=messages

# =========================================================================
# CONFIGURACOES DE SERIALIZACAO JSON
# =========================================================================
# Formato de datas em JSON (ISO-8601)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss


