# =========================================================================
# CONFIGURACOES DO CIRCUIT BREAKER (Resilience4j)
# =========================================================================
# Circuit Breaker para GLPI
resilience4j.circuitbreaker.instances.glpi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.glpi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.glpi.sliding-window-size=10
resilience4j.circuitbreaker.instances.glpi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.glpi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.glpi.automatic-transition-from-open-to-half-open-enabled=true

# Circuit Breaker para Evolution API
resilience4j.circuitbreaker.instances.evolution.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.evolution.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.evolution.sliding-window-size=10
resilience4j.circuitbreaker.instances.evolution.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.evolution.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.evolution.automatic-transition-from-open-to-half-open-enabled=true

# Exponha metricas do Circuit Breaker no Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers
management.health.circuitbreakers.enabled=true

# =========================================================================
# CONFIGURACOES DE RATE LIMITING (Resilience4j)
# =========================================================================
# DESABILITADO: Configurações movidas para RateLimitConfig.java (bean customizado)
# Rate limiters são criados programaticamente para evitar conflitos com autoconfiguracao

# =========================================================================
# CONFIGURACOES DO SWAGGER/OPENAPI
# =========================================================================
# Habilita Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Caminho customizado para Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Caminho para especificação OpenAPI JSON
springdoc.api-docs.path=/v3/api-docs

# Agrupa endpoints por tags automaticamente
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Mostra informações detalhadas
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.display-operation-id=false

# Pacotes a serem escaneados
springdoc.packages-to-scan=com.chatbot.chatbotglpi

# Não incluir endpoints do Actuator na documentação principal
springdoc.show-actuator=false