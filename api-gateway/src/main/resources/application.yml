server:
  port: 8080

spring:
  application:
    name: chatbot-api-gateway

  cloud:
    gateway:
      # Configuração global de CORS
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
            allowedHeaders: "*"
            exposedHeaders:
              - "Content-Type"
              - "Authorization"

      # Rotas do Gateway
      routes:
        # Rota para o Chatbot principal
        - id: chatbot-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/chatbot/**
          filters:
            - StripPrefix=2  # Remove /api/chatbot da URL
            - name: CircuitBreaker
              args:
                name: chatbotCircuitBreaker
                fallbackUri: forward:/fallback/chatbot
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: GET,POST
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # Rota para Webhooks do Evolution API
        - id: evolution-webhook
          uri: http://localhost:8082
          predicates:
            - Path=/webhook/**
          filters:
            - name: CircuitBreaker
              args:
                name: webhookCircuitBreaker
                fallbackUri: forward:/fallback/webhook

        # Rota para Health Checks
        - id: actuator
          uri: http://localhost:8082
          predicates:
            - Path=/actuator/**
          filters:
            - StripPrefix=0

  # Configuração do Redis (para Rate Limiter)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      chatbotCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

      webhookCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 20s
        failureRateThreshold: 50

  timelimiter:
    instances:
      chatbotCircuitBreaker:
        timeoutDuration: 10s
      webhookCircuitBreaker:
        timeoutDuration: 5s

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: when-authorized
    gateway:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
